<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Thailand Leveling</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;touch-action:none;user-select:none;font-family:system-ui,sans-serif}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
  #gl{z-index:0}#c{z-index:1}#hud{z-index:2}#ui{z-index:10}#giveup{z-index:5}#rotate{z-index:20}
  #hud{position:fixed;top:8px;left:10px;color:#e8e8e8;font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none}
  #ui{display:none;position:fixed;inset:0;background:#0b0d12e6;align-items:center;justify-content:center;overflow:auto}
  .card{background:#171a22;color:#eee;padding:18px 22px;border-radius:12px;display:flex;flex-direction:column;gap:8px;min-width:280px;max-width:92vw;max-height:94vh;overflow:auto}
  .card h2{margin:0 0 4px}.card .info{font-size:13px;color:#bcc}.card .rows{display:flex;flex-direction:column;gap:6px}.card button:disabled{opacity:.4}
  #chat{display:none;position:fixed;left:10px;bottom:10px;width:min(60vw,420px);z-index:6;padding:8px;border-radius:6px;border:1px solid #555;background:#0b0d12e6;color:#fff;font-size:14px}.card input[type=email],.card input[type=password],.card input#n{padding:8px;border-radius:6px;border:1px solid #444;background:#0b0d12;color:#fff}
  .card button{padding:9px;border:0;border-radius:6px;background:#3a7bd5;color:#fff;font-size:15px}.card button.alt{background:#444}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .job{border:1px solid #444;border-radius:6px;padding:6px;display:flex;flex-direction:column;font-size:13px}.job small{color:#9aa;font-size:11px}.err{color:#f66;margin:0;min-height:1em}
  #rotate{display:none;position:fixed;inset:0;background:#0b0d12;color:#fff;align-items:center;justify-content:center;font-size:20px}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="ui"></div>
<input id="chat" maxlength="200" placeholder="พิมพ์แล้วกด Enter · /p ข้อความ = แชตปาร์ตี้" autocomplete="off">
<button id="giveup" style="display:none;position:fixed;left:50%;top:58%;transform:translateX(-50%);padding:10px 22px;font-size:16px;border:0;border-radius:8px;background:#444;color:#fff">ยอมแพ้ (ไปโรงพยาบาล)</button>
<div id="rotate">📱 กรุณาหมุนเป็นแนวนอน</div>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module" src="game.js"></script>
</body>
</html>
